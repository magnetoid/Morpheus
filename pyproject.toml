[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "venv",
    ".venv",
    "*/migrations/*",
    "staticfiles",
    "media",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "DJ",   # flake8-django
    "S",    # bandit
    "PL",   # pylint
]
ignore = [
    "E501",     # line length handled by formatter
    "S101",     # assert use (tests)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic numbers
    "S105",     # hardcoded password False positive on cls vars
    "S106",
    # Lazy in-function imports are the documented house style (CLAUDE.md):
    # fail-soft dashboard tiles, plugin load-order isolation, and cycle
    # avoidance all depend on them. 1000+ deliberate sites — not a defect.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR"]
"**/test_*.py" = ["S", "PLR"]
"*/settings.py" = ["S105"]
"manage.py" = ["S"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
follow_imports = "silent"
exclude = "(venv|\\.venv|migrations|staticfiles)"
plugins = []

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.bandit]
# `*/tests/*` (not bare "tests") so plugin test suites under
# plugins/installed/*/tests/ are excluded too — they parse self-generated
# feed/SOAP XML, not untrusted input. Keep in sync with the CI `-x` list.
exclude_dirs = ["venv", ".venv", "*/tests/*", "*/migrations/*", "db.sqlite3"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "venv/*",
    "morph/asgi.py",
    "morph/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
# Runs the pytest-style plugin smoke suites (module-level `def test_` in
# plugins/installed/*/tests/__init__.py) that Django's unittest runner cannot
# collect — CI reported "Ran 0 tests" for 20 shipped plugins until this existed.
# CI invokes: pytest plugins/installed/*/tests/__init__.py (the glob auto-covers
# new plugins, so the silently-never-run class can't recur).
DJANGO_SETTINGS_MODULE = "morph.settings"
addopts = "-p no:cacheprovider"
