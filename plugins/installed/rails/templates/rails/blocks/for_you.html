{% load i18n %}<section class="morpheus-rails morpheus-rails--for-you" data-rail="for_you" aria-label="For you">
  <header>
    <h2>{% trans 'For you' %}</h2>
    <a href="/account/preferences/?rail=for_you" class="morpheus-rails__why">{% trans 'Why these?' %}</a>
  </header>
  <ol class="morpheus-rails__items" data-source="{% if customer %}personalised{% else %}trending{% endif %}">
    {% for product in for_you_products|default:trending_products|slice:":12" %}
      <li class="morpheus-rails__item" data-sku="{{ product.sku }}">
        <a href="{{ product.get_absolute_url }}">
          <img src="{{ product.hero_image|default:'' }}" alt="" loading="lazy" />
          <h3>{{ product.name }}</h3>
          <p>{{ product.price|default:"" }}</p>
        </a>
      </li>
    {% empty %}
      <li class="morpheus-rails__empty">{% trans 'Sign in for recommendations.' %}</li>
    {% endfor %}
  </ol>
</section>
