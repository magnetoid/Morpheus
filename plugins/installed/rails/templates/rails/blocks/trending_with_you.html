{% load i18n %}<section class="morpheus-rails morpheus-rails--trending" data-rail="trending" aria-label="Trending with shoppers like you">
  <header><h2>{% trans 'Trending with shoppers like you' %}</h2></header>
  <ol class="morpheus-rails__items">
    {% for product in trending_products|slice:":6" %}
      <li class="morpheus-rails__item">
        <a href="{{ product.get_absolute_url }}">
          <img src="{{ product.hero_image|default:'' }}" alt="" loading="lazy" />
          <h3>{{ product.name }}</h3>
          <p>{{ product.price|default:"" }}</p>
        </a>
      </li>
    {% empty %}
      <li class="morpheus-rails__empty" hidden></li>
    {% endfor %}
  </ol>
</section>
