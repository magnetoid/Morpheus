{% load i18n %}<section class="morpheus-lookbook__featured" aria-label="Featured looks">
  <h2>{% trans 'Featured looks' %}</h2>
  <ol class="morpheus-lookbook__rail">
    {% for look in featured_looks %}
      <li class="morpheus-lookbook__rail-item">
        <a href="/looks/{{ look.slug }}/">
          <img src="{{ look.cover_image|default:'' }}" alt="" loading="lazy" />
          <h3>{{ look.title }}</h3>
        </a>
      </li>
    {% empty %}
      <li class="morpheus-lookbook__empty" hidden></li>
    {% endfor %}
  </ol>
</section>
