{% extends "admin_dashboard/base.html" %}
{% block title %}{% if event %}Edit event{% else %}New event{% endif %} · Morpheus{% endblock %}
{% block content %}
<div class="space-y-4 max-w-2xl">
  <h1 class="text-xl font-semibold tracking-tight">{% if event %}Edit live event{% else %}New live event{% endif %}</h1>

  <form method="post" class="card card-padded space-y-4">
    {% csrf_token %}
    <div>
      <label class="form-label">Title</label>
      <input name="title" class="form-input" value="{{ event.title|default:'' }}" required>
    </div>
    <div>
      <label class="form-label">Slug <span class="text-[color:var(--text-muted)]">(optional — from title)</span></label>
      <input name="slug" class="form-input" value="{{ event.slug|default:'' }}">
    </div>
    <div>
      <label class="form-label">Description</label>
      <textarea name="description" class="form-input" rows="3">{{ event.description|default:'' }}</textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="form-label">Scheduled start</label>
        <input type="datetime-local" name="scheduled_start" class="form-input" value="{{ event.scheduled_start|date:'Y-m-d\TH:i' }}" required>
      </div>
      <div>
        <label class="form-label">Scheduled end</label>
        <input type="datetime-local" name="scheduled_end" class="form-input" value="{{ event.scheduled_end|date:'Y-m-d\TH:i' }}" required>
      </div>
    </div>
    <div>
      <label class="form-label">Embed URL <span class="text-[color:var(--text-muted)]">(YouTube Live / HLS)</span></label>
      <input name="embed_url" class="form-input" value="{{ event.embed_url|default:'' }}">
    </div>
    <div>
      <label class="form-label">Recording URL <span class="text-[color:var(--text-muted)]">(set after → page becomes a replay)</span></label>
      <input name="recording_url" class="form-input" value="{{ event.recording_url|default:'' }}">
    </div>
    <div>
      <label class="form-label">Status</label>
      <select name="status" class="form-input">
        {% for value, label in status_choices %}
        <option value="{{ value }}" {% if event.status == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label">Pinned product slugs <span class="text-[color:var(--text-muted)]">(comma-separated, in order)</span></label>
      <textarea name="pinned_slugs" class="form-input" rows="2">{{ pinned_slugs }}</textarea>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary">Save</button>
      <a href="/dashboard/live/" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
