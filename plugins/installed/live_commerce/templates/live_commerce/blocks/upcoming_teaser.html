{% load live_commerce %}
{% upcoming_live_event as event %}
{% if event %}
<a href="/live/{{ event.slug }}/" class="mx-auto my-8 flex max-w-5xl items-center justify-between gap-4 rounded-xl border border-neutral-200 px-6 py-5 hover:border-neutral-400 transition">
  <div class="flex items-center gap-3">
    {% if event.status == 'live' %}<span class="inline-flex items-center gap-1 rounded-full bg-red-600 px-2 py-0.5 text-xs font-semibold text-white">● LIVE NOW</span>
    {% else %}<span class="rounded-full bg-neutral-900 px-2 py-0.5 text-xs font-semibold text-white">UPCOMING</span>{% endif %}
    <div>
      <div class="font-medium">{{ event.title }}</div>
      <div class="text-sm text-neutral-500">{{ event.scheduled_start }}</div>
    </div>
  </div>
  <span class="text-sm font-medium text-neutral-700">Watch &amp; shop →</span>
</a>
{% endif %}
