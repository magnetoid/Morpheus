<div id="crm-chat" data-authed="{{ request.user.is_authenticated|yesno:'1,0' }}">
  <button type="button" id="crm-chat-toggle" aria-label="Chat with us">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div id="crm-chat-panel" hidden>
    <div class="crm-chat__head">
      <span>Chat with us</span>
      <button type="button" id="crm-chat-close" aria-label="Close">&times;</button>
    </div>
    <div id="crm-chat-log" class="crm-chat__log">
      <p class="crm-chat__hint">Hi! Ask us anything — we'll reply right here.</p>
    </div>
    <form id="crm-chat-form" class="crm-chat__form">
      <input type="email" id="crm-chat-email" placeholder="Your email (so we can follow up)" {% if request.user.is_authenticated %}hidden{% endif %} />
      <div class="crm-chat__row">
        <input type="text" id="crm-chat-input" placeholder="Type a message…" autocomplete="off" required />
        <button type="submit" aria-label="Send">→</button>
      </div>
    </form>
  </div>
</div>
<style>
  #crm-chat { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 9997; font-family: var(--sans, system-ui); }
  #crm-chat-toggle { width: 3.25rem; height: 3.25rem; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--ink, #111); color: var(--paper, #fff); display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.22); }
  #crm-chat-panel { position: absolute; right: 0; bottom: 4rem; width: min(22rem, 88vw); height: 28rem;
    background: #fff; color: #1a1a1a; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.28);
    display: flex; flex-direction: column; overflow: hidden; }
  .crm-chat__head { display: flex; align-items: center; justify-content: space-between;
    padding: .8rem 1rem; background: var(--ink, #111); color: var(--paper, #fff); font-weight: 600; }
  .crm-chat__head button { background: none; border: 0; color: inherit; font-size: 1.3rem; cursor: pointer; line-height: 1; }
  .crm-chat__log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .55rem; }
  .crm-chat__hint { color: #888; font-size: .9rem; margin: 0; }
  .crm-chat__msg { max-width: 80%; padding: .5rem .75rem; border-radius: 12px; font-size: .92rem; line-height: 1.4; white-space: pre-wrap; }
  .crm-chat__msg--customer { align-self: flex-end; background: var(--ink, #111); color: var(--paper, #fff); border-bottom-right-radius: 4px; }
  .crm-chat__msg--staff { align-self: flex-start; background: #f0eee8; color: #1a1a1a; border-bottom-left-radius: 4px; }
  .crm-chat__form { border-top: 1px solid #eee; padding: .6rem; display: flex; flex-direction: column; gap: .5rem; }
  .crm-chat__form input { border: 1px solid #ddd; border-radius: 10px; padding: .55rem .7rem; font: inherit; }
  .crm-chat__row { display: flex; gap: .5rem; }
  .crm-chat__row input { flex: 1; }
  .crm-chat__row button { border: 0; background: var(--ink, #111); color: var(--paper, #fff); border-radius: 10px; width: 2.6rem; cursor: pointer; font-size: 1.1rem; }
</style>
<script>
(() => {
  const root = document.getElementById('crm-chat');
  if (!root) return;
  const toggle = document.getElementById('crm-chat-toggle');
  const panel = document.getElementById('crm-chat-panel');
  const closeBtn = document.getElementById('crm-chat-close');
  const log = document.getElementById('crm-chat-log');
  const form = document.getElementById('crm-chat-form');
  const input = document.getElementById('crm-chat-input');
  const emailEl = document.getElementById('crm-chat-email');
  const KEY = 'crm-chat-thread';
  let threadId = (() => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } })();
  let lastAt = '';
  let pollTimer = null;
  const seen = new Set();

  function render(m) {
    if (seen.has(m.id)) return; seen.add(m.id);
    const hint = log.querySelector('.crm-chat__hint'); if (hint) hint.remove();
    const el = document.createElement('div');
    el.className = 'crm-chat__msg crm-chat__msg--' + m.sender;
    el.textContent = m.body;
    log.appendChild(el); log.scrollTop = log.scrollHeight;
    if (m.at > lastAt) lastAt = m.at;
  }
  async function poll() {
    if (!threadId) return;
    try {
      const u = '/support/chat/poll/?thread=' + encodeURIComponent(threadId) + (lastAt ? '&after=' + encodeURIComponent(lastAt) : '');
      const r = await fetch(u, { credentials: 'same-origin' });
      const d = await r.json();
      (d.messages || []).forEach(render);
    } catch {}
  }
  function startPolling() { if (!pollTimer) { poll(); pollTimer = setInterval(poll, 5000); } }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function open() { panel.hidden = false; startPolling(); input.focus(); }
  function close() { panel.hidden = true; stopPolling(); }
  toggle.addEventListener('click', () => panel.hidden ? open() : close());
  closeBtn.addEventListener('click', close);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    input.value = '';
    const body = new URLSearchParams({ message: text });
    if (threadId) body.set('thread', threadId);
    if (emailEl && emailEl.value.trim()) body.set('email', emailEl.value.trim());
    try {
      const r = await fetch('/support/chat/send/', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
      const d = await r.json();
      if (d.ok) {
        if (d.thread) { threadId = d.thread; try { localStorage.setItem(KEY, threadId); } catch {} }
        if (d.message) render(d.message);
        if (emailEl) emailEl.hidden = true;
        startPolling();
      }
    } catch {}
  });
})();
</script>
