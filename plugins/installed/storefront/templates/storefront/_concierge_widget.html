{# Floating Concierge chat widget. Posts to the existing
   /api/agents/concierge/invoke endpoint. Storefront-rendered, anonymous-safe. #}
<div id="morpheus-concierge-root">
  <button id="morpheus-concierge-toggle" aria-label="Open chat" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
  </button>
  <div id="morpheus-concierge-panel" hidden>
    <div id="morpheus-concierge-header">
      <span>Ask the Concierge</span>
      <button id="morpheus-concierge-close" aria-label="Close" type="button">×</button>
    </div>
    <div id="morpheus-concierge-log">
      <div class="morpheus-concierge-msg morpheus-concierge-bot">Hi — I can help you find a book, check stock, or answer questions about your order. How can I help?</div>
    </div>
    <form id="morpheus-concierge-form">
      <input type="text" id="morpheus-concierge-input" placeholder="Type a message…" autocomplete="off" required>
      <button type="submit" aria-label="Send">→</button>
    </form>
  </div>
</div>

<style>
  #morpheus-concierge-toggle{position:fixed;bottom:1.25rem;right:1.25rem;z-index:1000;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .15s}
  #morpheus-concierge-toggle:hover{transform:translateY(-2px)}
  #morpheus-concierge-panel{position:fixed;bottom:5.25rem;right:1.25rem;z-index:1000;width:340px;max-width:calc(100vw - 2.5rem);height:480px;max-height:calc(100vh - 7rem);background:#fff;border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #morpheus-concierge-header{padding:.85rem 1rem;border-bottom:1px solid #eee;font-weight:600;font-size:.95rem;display:flex;align-items:center;justify-content:space-between}
  #morpheus-concierge-close{background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:#666;padding:0 .25rem}
  #morpheus-concierge-log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem;font-size:.9rem}
  .morpheus-concierge-msg{padding:.55rem .8rem;border-radius:10px;max-width:85%;white-space:pre-wrap;line-height:1.4}
  .morpheus-concierge-bot{background:#f4f4f4;color:#222;align-self:flex-start;border-bottom-left-radius:3px}
  .morpheus-concierge-user{background:#111;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
  .morpheus-concierge-thinking{color:#888;font-style:italic;align-self:flex-start;font-size:.8rem;padding:.2rem .8rem}
  #morpheus-concierge-form{display:flex;border-top:1px solid #eee;padding:.5rem;gap:.4rem}
  #morpheus-concierge-input{flex:1;border:1px solid #ddd;border-radius:8px;padding:.55rem .75rem;font-size:.9rem;font-family:inherit}
  #morpheus-concierge-input:focus{outline:none;border-color:#111}
  #morpheus-concierge-form button[type=submit]{background:#111;color:#fff;border:none;border-radius:8px;padding:0 1rem;cursor:pointer;font-size:1rem}
</style>

<script>
(function(){
  var toggle = document.getElementById('morpheus-concierge-toggle');
  var panel  = document.getElementById('morpheus-concierge-panel');
  var close  = document.getElementById('morpheus-concierge-close');
  var form   = document.getElementById('morpheus-concierge-form');
  var input  = document.getElementById('morpheus-concierge-input');
  var log    = document.getElementById('morpheus-concierge-log');

  function append(text, cls){
    var d = document.createElement('div');
    d.className = 'morpheus-concierge-msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  toggle.addEventListener('click', function(){
    panel.hidden = !panel.hidden;
    if (!panel.hidden) input.focus();
  });
  close.addEventListener('click', function(){ panel.hidden = true; });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = (input.value || '').trim();
    if (!text) return;
    append(text, 'morpheus-concierge-user');
    input.value = '';
    var thinking = document.createElement('div');
    thinking.className = 'morpheus-concierge-thinking';
    thinking.textContent = '…';
    log.appendChild(thinking);
    log.scrollTop = log.scrollHeight;
    fetch('/api/agents/concierge/invoke', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
      credentials: 'same-origin',
    }).then(function(r){ return r.json(); })
      .then(function(data){
        thinking.remove();
        append(data.text || data.error || '(no reply)', 'morpheus-concierge-bot');
      })
      .catch(function(){
        thinking.remove();
        append('Sorry — connection error.', 'morpheus-concierge-bot');
      });
  });
})();
</script>
