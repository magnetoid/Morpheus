{% load i18n %}{% if in_checkout_upsell %}
<section class="morpheus-upsell" aria-label="In-checkout upsell">
  <p>{{ settings.in_checkout_copy|default:'' }}</p>
  <article class="morpheus-upsell__card" data-product-slug="{{ in_checkout_upsell.slug }}">
    <img src="{{ in_checkout_upsell.hero_image|default:'' }}" alt="" loading="lazy" />
    <h3>{{ in_checkout_upsell.name }}</h3>
    <span>{{ in_checkout_upsell.price|default:"" }}</span>
    <button type="button" data-action="add" data-product-id="{{ in_checkout_upsell.id }}">
      {% trans 'Add to my order' %}
    </button>
  </article>
</section>
{% endif %}
