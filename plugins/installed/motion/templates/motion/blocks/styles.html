{% load i18n %}<style id="morpheus-motion-styles"
       data-intensity="{{ settings.intensity|default:'standard' }}"
       data-reduced-motion="{{ settings.reduced_motion_default|yesno:'1,0' }}">
  /* Skeleton shimmer. */
  @keyframes morpheus-shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
  .morpheus-skeleton {
    background-color: #eee;
    background-image: linear-gradient(90deg, #eee 0px, #f5f5f5 40px, #eee 80px);
    background-size: 800px 100%;
    animation: morpheus-shimmer 1.4s linear infinite;
    border-radius: 6px;
  }

  /* Page transition. Applied to <html> by runtime.js, so it must NOT animate
     `transform`: a transform on the root element (even a filling one that ends
     at `none`) makes <html> the containing block for `position: fixed`, so the
     staff admin bar — the one fixed element in the header stack — scrolls away
     with the page instead of staying pinned, leaving a 32px hole above the
     sticky store header. Opacity-only keeps the fade (and the `both` backwards
     fill still prevents a flash of the un-faded page). */
  .morpheus-page-enter { animation: morpheus-fade-in 240ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes morpheus-fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* Button press. */
  button.morpheus-press:active { transform: scale(0.985); transition: transform 80ms ease; }

  /* Reduced motion: opt out of all of it. */
  @media (prefers-reduced-motion: reduce) {
    .morpheus-skeleton,
    .morpheus-page-enter,
    button.morpheus-press:active { animation: none !important; transition: none !important; transform: none !important; }
  }
</style>
