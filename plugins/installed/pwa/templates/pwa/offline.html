<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — {{ store_name }}</title>
  <meta name="theme-color" content="#f6f1e7">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #f6f1e7; color: #2b2b2b;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center; padding: 2rem;
    }
    .wrap { max-width: 28rem; }
    .dot {
      width: 64px; height: 64px; border-radius: 50%;
      background: #c5694e; margin: 0 auto 1.5rem;
    }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 1.6rem; margin: 0 0 .5rem; }
    p { color: #6b6258; line-height: 1.6; margin: 0 0 1.5rem; }
    button {
      font: inherit; cursor: pointer;
      background: #2b2b2b; color: #f6f1e7; border: 0;
      padding: .7rem 1.4rem; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>{{ store_name }} can't reach the network right now. Pages you've
       already visited are still available — or try again once you're
       back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
