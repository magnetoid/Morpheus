{# Cmd+K command palette. Toggled by Morph.palette.toggle() in #}
{# dashboard.js. Header search button + Cmd+K / Ctrl+K both open it. #}
<div id="morph-palette" hidden class="fixed inset-0 z-50" style="font-family: inherit;">
  <div data-mp-backdrop class="absolute inset-0" style="background: rgba(0,0,0,.45);"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="mp-input"
       class="card relative mx-auto"
       style="max-width: 540px; width: calc(100% - 2rem); margin-top: 8vh; max-height: 70vh; display: flex; flex-direction: column;">
    <div style="border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .5rem; padding: .75rem 1rem;">
      <i data-lucide="search" class="h-4 w-4" style="color: var(--text-muted);"></i>
      <input id="mp-input" type="text" placeholder="Jump to anything…" autocomplete="off"
             style="flex:1; border:0; outline:0; background: transparent; font-size: .95rem; padding: .15rem 0;">
      <kbd style="font-size: .7rem; padding: .15rem .4rem; border: 1px solid var(--border); border-radius: 4px;">Esc</kbd>
    </div>
    <div id="mp-results" style="flex:1; overflow-y: auto; padding: .35rem;"></div>
    <div style="border-top: 1px solid var(--border); padding: .5rem .9rem; font-size: .7rem; color: var(--text-muted); display:flex; justify-content:space-between;">
      <span><kbd style="padding: .05rem .3rem; border: 1px solid var(--border); border-radius: 3px;">↑↓</kbd> navigate · <kbd style="padding: .05rem .3rem; border: 1px solid var(--border); border-radius: 3px;">⏎</kbd> open</span>
      <span>Cmd+K to toggle</span>
    </div>
  </div>
</div>

<style>
  .mp-row {
    display: flex; align-items: center; gap: .65rem;
    padding: .55rem .85rem; border-radius: 6px;
    cursor: pointer; user-select: none; font-size: .9rem;
  }
  .mp-row:hover, .mp-row.is-active { background: var(--nav-hover-bg); }
  .mp-row[data-kind] .mp-icon-wrap {
    width: 1.6rem; height: 1.6rem; border-radius: 4px;
    background: var(--surface-2); display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); flex-shrink: 0;
  }
  .mp-label { font-weight: 500; }
  .mp-hint { font-size: .75rem; color: var(--text-muted); margin-top: .1rem; }
  .mp-section-title {
    font-size: .65rem; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-subtle); padding: .55rem .85rem .25rem; font-weight: 600;
  }
  .mp-empty { padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: .85rem; }
</style>
