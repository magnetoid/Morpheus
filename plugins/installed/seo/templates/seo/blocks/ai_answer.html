{% load seo %}
{% seo_ai_answer_block product as aeo %}
{% if aeo.enabled %}{% if aeo.answer or aeo.facts %}
<aside class="seo-ai-answer" aria-label="Key facts" itemscope itemtype="https://schema.org/Answer" style="
    margin: 1rem 0 1.25rem;
    padding: 0.9rem 1.1rem;
    border: 1px solid var(--rule, #e3dfd6);
    border-left: 3px solid var(--accent, #b8732d);
    border-radius: 0.5rem;
    background: var(--paper-2, #faf8f3);
    font-size: 0.92rem;
    color: var(--ink, #2a2a2a);
">
  {% if aeo.answer %}
  <p class="seo-ai-answer__tldr" itemprop="text" style="margin: 0 0 0.5rem; line-height: 1.5;">
    <strong style="font-weight: 600;">In short:</strong> {{ aeo.answer }}
  </p>
  {% endif %}
  {% if aeo.facts %}
  <dl class="seo-ai-answer__facts" style="
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.15rem 0.75rem;
      font-size: 0.86rem;
  ">
    {% for label, value in aeo.facts %}
    <dt style="color: var(--muted, #6b6256); font-weight: 500;">{{ label }}</dt>
    <dd style="margin: 0;">{{ value }}</dd>
    {% endfor %}
  </dl>
  {% endif %}
</aside>
{% endif %}{% endif %}
