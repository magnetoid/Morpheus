{% load i18n %}<section class="morpheus-immersive__hero" data-product="{{ product.slug }}" aria-label="Product video">
  {% if product.hero_video_url %}
    <video class="morpheus-immersive__video"
           autoplay muted loop playsinline
           poster="{{ product.hero_poster|default:'' }}"
           aria-describedby="morpheus-immersive__hero-caption"
           data-reduced-motion-fallback="1">
      <source src="{{ product.hero_video_url }}" type="video/mp4" />
    </video>
    <p id="morpheus-immersive__hero-caption" class="morpheus-immersive__caption">
      {% trans 'Tap to see it in motion.' %}
    </p>
  {% else %}
    <div class="morpheus-immersive__placeholder" aria-hidden="true"></div>
  {% endif %}
</section>
