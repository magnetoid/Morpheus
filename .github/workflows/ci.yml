name: ci

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DEBUG: "1"
  SECRET_KEY: "ci-test-secret-key-not-for-production"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  DATABASE_URL: "sqlite:///db.sqlite3"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.8 mypy==1.13.0 bandit==1.8.0
      - name: ruff
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: bandit (security)
        # B308/B703 (mark_safe) are covered per-site by ruff S308 noqa review.
        run: bandit -q -r . -x ./venv,./tests,./.venv,./db.sqlite3 -ll -s B308,B703

  migrations:
    # Apply every migration against real Postgres — sqlite (used by the test job)
    # types loosely and silently accepts e.g. a bigint->uuid AlterField cast that
    # crashes the prod `migrate`. PR #62 and PR #64 both 503'd prod this way; this
    # job is the gate that catches it before merge.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morph_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: migrate on Postgres (catches cast/apply errors sqlite masks)
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/morph_ci"
        run: python manage.py migrate --noinput

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage pytest pytest-django
      - name: Django system checks (BLOCKING — catches model errors that crash prod boot)
        # Plain `check` fails on Error-level issues (e.g. fields.E301/E300/E307 —
        # a FK to a swapped-out user model, a lazy ref to a non-existent model).
        # These break the prod boot, so this gate must NOT be `|| true`d.
        run: python manage.py check
      - name: Django deploy checks (advisory — security/HSTS warnings)
        run: python manage.py check --deploy --fail-level WARNING || true
      - name: Migrations are present
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: |
          coverage run --source='.' manage.py test --noinput
          coverage report -m --fail-under=40
          coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  api-stability:
    # Gates docs/API_STABILITY.md — diff the Python SDK public surface
    # against docs/sdk-baseline.json. Removals block; additions pass.
    # To refresh the baseline after a deliberate breaking change + major
    # version bump: `python scripts/check_api_stability.py --save` and
    # commit the updated baseline in the SAME PR that ships the break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: API stability — diff against baseline
        run: python scripts/check_api_stability.py
