name: deploy-smoke

# A merge to main IS a production deploy (Coolify watches the repo). This job
# waits for production to converge on the version in the pushed commit, then
# asserts basic health — it turns a missed webhook, failed build, or boot-time
# 503 into a red X on the commit instead of a silent outage.
on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-smoke
  cancel-in-progress: true # a newer push supersedes the wait for the old one

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 25 minutes of smoke, a minute of checks, then up to 30 minutes for the
    # stores put back to come up.
    timeout-minutes: 70
    env:
      MORPHEUS_DEPLOY_HOOKS: ${{ secrets.MORPHEUS_DEPLOY_HOOKS }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the guard reads the release tags
      - name: Wait for production to serve this version, then smoke it
        run: bash scripts/deploy_smoke.sh
      - name: Put back the stores this release left down
        if: failure()
        run: python3 scripts/deploy_guard.py rollback
