name: accessibility

# Runs axe-core against the live storefront. axe catches a different
# set of violations than Lighthouse's accessibility audit (Lighthouse
# uses axe-core under the hood but with a narrower ruleset). This
# workflow runs the full WCAG 2.2 AA ruleset and fails on any new
# violation that wasn't in the documented baseline.
#
# WCAG 2.2 AA is the bar for the EU Accessibility Act (enforced from
# 28 June 2025 for new products; existing services grandfathered until
# 2030). Non-compliance is increasingly a legal-and-marketing risk in
# the EU; the audit doc at docs/accessibility.md tracks our position.
#
# It runs after `deploy-smoke` has watched production converge on the pushed
# version — never on the push itself. A push to main IS the deploy: for the
# next ten-odd minutes the live store still serves the previous version and
# then briefly a 503 while Coolify swaps containers, so an audit triggered by
# the push tested the wrong build or none (this workflow was red on every run
# for two weeks that way). A pull request cannot be audited here either — the
# live store does not carry the PR's code — so there is no PR trigger.

on:
  workflow_run:
    workflows: ["deploy-smoke"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: a11y
  cancel-in-progress: true

jobs:
  axe:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli@4.10.x

      # axe fetches the newest ChromeDriver, which runs one Chrome version ahead
      # of the runner's preinstalled Chrome as soon as Chrome releases: "This
      # version of ChromeDriver only supports Chrome version 155 / Current browser
      # version is 154". Every URL then failed before it was audited, and the job
      # reported that as WCAG violations (red on every run until 2026-10-09).
      # Install the driver built for the Chrome that is actually on the runner.
      - name: ChromeDriver for the runner's Chrome
        run: |
          set -euo pipefail
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          # The exact build when Chrome for Testing has it, else the newest of its major.
          npx --yes @puppeteer/browsers install "chromedriver@${CHROME_VERSION}" --path "$RUNNER_TEMP/browsers" \
            || npx --yes @puppeteer/browsers install "chromedriver@${CHROME_VERSION%%.*}" --path "$RUNNER_TEMP/browsers"
          DRIVER=$(find "$RUNNER_TEMP/browsers" -type f -name chromedriver | head -1)
          test -x "$DRIVER"
          echo "CHROMEDRIVER_PATH=$DRIVER" >> "$GITHUB_ENV"

      - name: Run axe against 5 representative URLs
        run: |
          set -euo pipefail
          URLS=(
            "https://dotbooks.store/"
            "https://dotbooks.store/products/"
            "https://dotbooks.store/products/peter-pan/"
            "https://dotbooks.store/cart/"
            "https://dotbooks.store/journal/"
          )
          mkdir -p a11y-reports
          FAIL=0
          for URL in "${URLS[@]}"; do
            SAFE=$(echo "$URL" | sed 's|[^a-zA-Z0-9]|_|g')
            echo "::group::axe $URL"
            # --load-delay: the theme fades cards in on scroll-reveal (under a
            # second). axe sampling text mid-fade reads a 1.8:1 contrast on a
            # button that settles at 4.5:1 — 42 such "violations" on one run.
            # Audit the settled page.
            if ! axe "$URL" \
              --chromedriver-path "$CHROMEDRIVER_PATH" \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa,best-practice \
              --load-delay=2000 \
              --dir a11y-reports --save "${SAFE}.json" \
              --exit; then
              echo "::error::axe found WCAG violations on $URL — see the axe-reports artefact"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

      # Not a dot-directory: upload-artifact v4 skips hidden paths by default,
      # which is why `.a11y-reports/` never produced an artefact.
      - name: Upload axe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-reports
          path: a11y-reports/
          retention-days: 30
