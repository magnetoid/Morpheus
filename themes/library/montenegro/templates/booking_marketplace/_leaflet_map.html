{# A map draws once it nears the screen: Leaflet's stylesheet and script come from unpkg only then, so a page whose map is never reached never fetches them (SEO and analytics audit, release 5). #}
<script nonce="{{ csp_nonce }}">(function(){var m=document.getElementById('{{ map_id }}');if(!m)return;
var draw=function(){if(!window.L)return setTimeout(draw,120);var p=[+m.dataset.lat,+m.dataset.lng];var map=L.map(m).setView(p,{{ zoom|default:14 }});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'\u00a9 OpenStreetMap'}).addTo(map);L.marker(p).addTo(map);};
var load=function(){if(!document.querySelector('link[data-leaflet]')){var c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';c.setAttribute('data-leaflet','');document.head.appendChild(c);var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s);}draw();};
if(!('IntersectionObserver' in window))return load();
var io=new IntersectionObserver(function(es){if(es.some(function(e){return e.isIntersecting;})){io.disconnect();load();}},{rootMargin:'400px'});io.observe(m);})();</script>
