<section style="padding: 4rem 0; background: var(--paper-2);">
  <div class="wrap" style="max-width: 600px; text-align: center;">
    {% if settings.heading %}<h2 class="display display-l" style="margin: 0 0 .85rem;">{{ settings.heading }}</h2>{% endif %}
    {% if settings.subheading %}<p class="lede" style="margin: 0 auto 1.5rem;">{{ settings.subheading }}</p>{% endif %}
    <form method="post" action="/newsletter/subscribe/" style="display: flex; gap: .65rem; max-width: 420px; margin: 0 auto;">
      {% csrf_token %}
      <input type="email" name="email" required placeholder="you@example.com"
             style="flex: 1; height: 44px; padding: 0 1rem; border: 1px solid var(--rule);
                    border-radius: 999px; background: var(--paper); font-size: .95rem;">
      <button type="submit" class="btn btn-primary">{{ settings.cta_label|default:"Subscribe" }}</button>
    </form>
  </div>
</section>
