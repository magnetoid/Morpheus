<section style="padding: 4rem 0;">
  <div class="wrap">
    {% if settings.heading %}
    <h2 class="display display-l" style="margin: 0 0 2rem;">{{ settings.heading }}<span class="text-accent">.</span></h2>
    {% endif %}
    {% if products %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem;">
      {% for p in products %}
      <a href="/products/{{ p.slug }}/" class="book" style="text-decoration: none; color: inherit;">
        <div class="cover-wrap">
          {% with primary=p.images.first %}
          {% if primary %}<img src="{{ primary.image.url }}" alt="{{ primary.alt_text|default:p.name }}">
          {% else %}<div style="display:flex; align-items:center; justify-content:center; height:100%; color: var(--muted);">📕</div>
          {% endif %}
          {% endwith %}
        </div>
        <p style="font-family: var(--serif); margin: .5rem 0 .15rem; line-height: 1.3;">{{ p.name }}</p>
        <p class="meta">{{ p.price }}</p>
      </a>
      {% endfor %}
    </div>
    {% else %}
    <p class="meta" style="text-align: center;">No products to feature yet.</p>
    {% endif %}
  </div>
</section>
