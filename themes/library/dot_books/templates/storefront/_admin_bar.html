{% if request.user.is_authenticated and request.user.is_staff %}
<div class="storefront-admin-bar">
  <div class="wrap" style="display:flex; align-items:center; gap: 1.25rem; height: 32px; font-size: 12px; color: #e8e8e8;">
    <a href="/dashboard/" style="color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: .45rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
      Morpheus
    </a>
    <a href="/dashboard/" style="color: #cfcfcf;">Dashboard</a>
    {% if active_pdp_edit_url %}<a href="{{ active_pdp_edit_url }}" style="color: #cfcfcf;">Edit page</a>{% endif %}
    <a href="/dashboard/assistant/" style="color: #cfcfcf;">Linda</a>
    <a href="/dashboard/orders/" style="color: #cfcfcf;">Orders</a>
    <a href="/dashboard/customers/" style="color: #cfcfcf;">Users</a>
    <span style="flex: 1;"></span>
    <span style="color: #9a9a9a;">{{ request.user.email|default:request.user.username }}</span>
    <form method="post" action="/accounts/logout/" style="margin: 0;">
      {% csrf_token %}
      <button type="submit" style="background: transparent; border: 0; color: #cfcfcf; cursor: pointer; font-size: 12px; padding: 0;">Sign out</button>
    </form>
  </div>
</div>
<style>
.storefront-admin-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #1a1a1a; color: #e8e8e8;
  border-bottom: 1px solid #333;
  font-family: var(--sans);
}
.storefront-admin-bar a:hover { color: #fff !important; }
body.has-admin-bar { padding-top: 32px; }
body.has-admin-bar .topbar { top: 32px !important; }
@media (max-width: 640px) {
  .storefront-admin-bar { font-size: 11px !important; }
  .storefront-admin-bar a:not(:first-child):not(:nth-child(2)) { display: none; }
}
</style>
<script>document.body.classList.add('has-admin-bar');</script>
{% endif %}
