{# Floating Linda chat widget — included by admin_dashboard/base.html. #}
{% load static %}
<div id="morph-assistant" style="position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 9000; font-family: 'Inter', system-ui, sans-serif;">
  <button id="morph-assistant-toggle" type="button" aria-label="Open Linda" style="
      border: none; background: var(--primary, #1a1a1a); color: var(--primary-fg, #fff);
      border-radius: 999px; padding: .75rem 1.1rem; font-size: .85rem; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,.18); cursor: pointer; display: inline-flex;
      align-items: center; gap: .5rem;">
    <img src="{% static 'assistant/linda-avatar.jpg' %}" alt="" style="width:22px;height:22px;border-radius:50%;object-fit:cover;margin:-.3rem 0;"> Linda
  </button>
  <div id="morph-assistant-panel" style="
      display: none; position: absolute; right: 0; bottom: 3.5rem;
      width: 380px; max-width: calc(100vw - 2.5rem); height: 540px; max-height: calc(100vh - 5rem);
      background: var(--surface, #fff); border: 1px solid var(--border, #e3e3e3);
      border-radius: 12px; box-shadow: 0 24px 48px rgba(0,0,0,.18);
      flex-direction: column; overflow: hidden;">
    <div style="padding: .55rem .75rem .55rem 1rem; border-bottom: 1px solid var(--border, #e3e3e3); display: flex; justify-content: space-between; align-items: center; gap: .5rem;">
      <div style="display:flex; align-items:center; gap:.45rem; min-width: 0;">
        <img src="{% static 'assistant/linda-avatar.jpg' %}" alt="" style="width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;">
        <strong style="font-size: .9rem;">Linda</strong>
        <select id="morph-assistant-mode" aria-label="Linda mode"
                style="font-size:.7rem; background:transparent; border:1px solid var(--border,#e3e3e3); border-radius:999px; padding:.1rem .45rem; color:var(--text-muted,#6b7280); cursor:pointer; max-width:9rem;">
          <option value="general">General</option>
          <option value="sales">Sales</option>
          <option value="support">Support</option>
          <option value="ops">Operations</option>
          <option value="dev">Developer</option>
        </select>
      </div>
      <div style="display:flex; gap:.5rem; flex-shrink:0;">
        <a href="/dashboard/assistant/" style="font-size:.75rem; color:var(--text-muted, #6b7280); text-decoration:underline;">Open full</a>
        <button id="morph-assistant-close" type="button" aria-label="Close" style="border:none;background:transparent;cursor:pointer;font-size:1.1rem;color:var(--text-muted,#6b7280);">×</button>
      </div>
    </div>
    <div id="morph-assistant-log" style="flex:1; padding: .75rem; overflow-y:auto; font-size:.85rem;"></div>
    <style>
      /* Widget-local Markdown rendering and typing caret. What Linda is doing
         while she works comes from assistant/activity.css, shared with the page. */
      #morph-assistant .morph-msg-body p { margin: 0 0 .55rem; }
      #morph-assistant .morph-msg-body p:last-child { margin: 0; }
      #morph-assistant .morph-msg-body strong { font-weight: 600; }
      #morph-assistant .morph-msg-body em { font-style: italic; }
      #morph-assistant .morph-msg-body ul,
      #morph-assistant .morph-msg-body ol { margin: .25rem 0 .55rem 1.1rem; padding: 0; }
      #morph-assistant .morph-msg-body li { margin: .1rem 0; }
      #morph-assistant .morph-msg-body code {
        background: var(--surface-2, #f4f4f4); padding: .1rem .3rem;
        border-radius: 3px; font-family: ui-monospace, Menlo, monospace;
        font-size: .85em;
      }
      #morph-assistant .morph-msg-body pre {
        background: var(--surface-2, #f4f4f4); border-radius: 5px;
        padding: .55rem .7rem; overflow-x: auto;
        font-family: ui-monospace, Menlo, monospace; font-size: .78rem;
        line-height: 1.45; margin: .35rem 0;
      }
      #morph-assistant .morph-msg-body pre code { background: transparent; padding: 0; }
      #morph-assistant .morph-msg-body a {
        color: var(--accent, #c5694e);
        text-decoration: underline; text-underline-offset: 2px;
      }
      #morph-assistant .morph-msg-body.is-typing::after {
        content: '';
        display: inline-block;
        width: .5rem; height: 1em;
        margin-left: 2px; vertical-align: -.12em;
        background: currentColor; opacity: .5;
        animation: morph-caret 0.9s steps(2) infinite;
      }
      @keyframes morph-caret {
        0%, 50% { opacity: .5; }
        50.01%, 100% { opacity: 0; }
      }
      /* No border, like the Linda page's composer: a deeper fill marks focus. */
      #morph-assistant-form input:focus { outline: none; background: color-mix(in srgb, var(--surface-2, #f3f3f5) 94%, var(--text, #1a1a1a)); }
    </style>
    <form id="morph-assistant-form" style="display:flex; gap:.5rem; padding: .65rem; border-top: 1px solid var(--border, #e3e3e3);">
      <input type="text" name="message" placeholder="Ask Linda…"
        autocomplete="off" required style="flex:1; padding:.5rem .75rem; border: 0; background: var(--surface-2, #f3f3f5); color: var(--text, #1a1a1a); border-radius: 6px; font-size:.85rem;">
      <button type="submit" style="border:none; background: var(--primary, #1a1a1a); color: var(--primary-fg, #fff); border-radius: 6px; padding:.5rem .85rem; font-size:.85rem; cursor:pointer;">Send</button>
    </form>
  </div>
</div>
<link rel="stylesheet" href="{% static 'assistant/activity.css' %}">
<script src="{% static 'assistant/activity.js' %}" defer></script>
<script>
(() => {
  const toggle = document.getElementById('morph-assistant-toggle');
  const panel = document.getElementById('morph-assistant-panel');
  const closeBtn = document.getElementById('morph-assistant-close');
  const form = document.getElementById('morph-assistant-form');
  const log = document.getElementById('morph-assistant-log');
  const modeSelect = document.getElementById('morph-assistant-mode');
  const LINDA_AVATAR = "{% static 'assistant/linda-avatar.jpg' %}";
  const getCsrf = () => (document.querySelector('[name=csrfmiddlewaretoken]')?.value
                        || document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '');

  /* Mode persists in sessionStorage, shared with the full Linda page. */
  const MODE_STORAGE_KEY = 'linda:mode';
  if (modeSelect) {
    modeSelect.value = sessionStorage.getItem(MODE_STORAGE_KEY) || 'general';
    modeSelect.addEventListener('change', function () {
      sessionStorage.setItem(MODE_STORAGE_KEY, modeSelect.value);
    });
  }

  /* Minimal Markdown — same renderer as the full page. */
  function escapeMd(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderMarkdown(src) {
    if (!src) return '';
    var out = escapeMd(src);
    out = out.replace(/```([\s\S]*?)```/g, function (_, body) {
      return '<pre><code>' + body.replace(/^\n/, '') + '</code></pre>';
    });
    out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/(^|[\s\(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    out = out.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );
    out = out.replace(/((?:(?:^|\n)[-*]\s+.+)+)/g, function (block) {
      var items = block.trim().split(/\n[-*]\s+/).map(function (s) {
        return '<li>' + s.replace(/^[-*]\s+/, '') + '</li>';
      });
      return '\n<ul>' + items.join('') + '</ul>';
    });
    out = out.replace(/((?:(?:^|\n)\d+\.\s+.+)+)/g, function (block) {
      var items = block.trim().split(/\n\d+\.\s+/).map(function (s) {
        return '<li>' + s.replace(/^\d+\.\s+/, '') + '</li>';
      });
      return '\n<ol>' + items.join('') + '</ol>';
    });
    out = out.split(/\n{2,}/).map(function (chunk) {
      chunk = chunk.trim();
      if (!chunk) return '';
      if (/^<(ul|ol|pre|p)/.test(chunk)) return chunk;
      return '<p>' + chunk.replace(/\n/g, ' ') + '</p>';
    }).join('\n');
    return out;
  }

  function pushLine(role, text, toolName) {
    const div = document.createElement('div');
    const isUser = role === 'user';
    const isTool = role === 'tool';
    div.style.cssText = `margin: .4rem 0; padding: .55rem .65rem; border-radius: 8px;
      background: ${isUser ? 'var(--surface-2,#fafafa)' : isTool ? 'rgba(0,150,255,0.06)' : 'var(--surface,#fff)'};
      border: ${isUser ? 'none' : '1px solid var(--border,#e3e3e3)'}; font-size: .85rem;`;
    const label = isTool ? `🔧 ${toolName || 'tool'}` : isUser ? 'You' : 'Linda';
    const body = role === 'assistant' ? renderMarkdown(text || '') :
      (text || '').replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[m]);
    const avatar = role === 'assistant'
      ? `<img src="${LINDA_AVATAR}" alt="" style="width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:.25rem;">`
      : '';
    div.innerHTML = `<strong style="font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted,#6b7280);">${avatar}${label}</strong>
      <div class="morph-msg-body" style="margin-top:.2rem;">${body}</div>`;
    log.appendChild(div); log.scrollTop = log.scrollHeight;
    return div;
  }

  /* Typewriter — same paced reveal as the full page (22 ms/char by
     default; adaptive to backlog). */
  function makeTypewriter(bodyEl) {
    var queue = [];
    var raw = '';
    var draining = false;
    function drain() {
      draining = true;
      function tick() {
        if (!queue.length) {
          draining = false;
          bodyEl.classList.remove('is-typing');
          return;
        }
        var delay = queue.length > 200 ? 4 : (queue.length > 60 ? 12 : 22);
        raw += queue.shift();
        bodyEl.innerHTML = renderMarkdown(raw);
        bodyEl.classList.add('is-typing');
        log.scrollTop = log.scrollHeight;
        setTimeout(tick, delay);
      }
      tick();
    }
    return {
      enqueue: function (text) {
        for (var i = 0; i < text.length; i++) queue.push(text[i]);
        if (!draining) drain();
      },
      finalize: function (text) {
        queue.length = 0;
        raw = text || raw;
        bodyEl.innerHTML = renderMarkdown(raw);
        bodyEl.classList.remove('is-typing');
        log.scrollTop = log.scrollHeight;
      },
    };
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
    });
  }

  function loadHistory() {
    fetch('/dashboard/assistant/history/').then(r => r.json()).then(data => {
      log.innerHTML = '';
      (data.messages || []).forEach(m => pushLine(m.role, m.content, m.tool_name));
    }).catch(() => {});
  }

  toggle.addEventListener('click', () => {
    if (panel.style.display === 'flex') { panel.style.display = 'none'; return; }
    panel.style.display = 'flex'; loadHistory();
  });
  closeBtn.addEventListener('click', () => { panel.style.display = 'none'; });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const input = form.querySelector('input[name=message]');
    const text = (input.value || '').trim();
    if (!text) return;
    pushLine('user', text); input.value = '';
    // What Linda is doing, live (static/assistant/activity.js).
    var turn = window.LindaActivity.start(log, { avatar: LINDA_AVATAR, compact: true });
    log.scrollTop = log.scrollHeight;

    var assistantTextEl = null;
    var typer = null;
    function ensureAssistant() {
      if (!assistantTextEl) {
        assistantTextEl = pushLine('assistant', '');
        var body = assistantTextEl.querySelector('.morph-msg-body');
        typer = makeTypewriter(body);
      }
      return assistantTextEl;
    }

    fetch('/dashboard/assistant/stream/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
      // Send the URL + title of the dashboard page Linda was opened
      // from so the assistant can answer "this product / this order"
      // without forcing the merchant to re-paste a slug. Server-side
      // handler reads `page_url` and `page_title` and threads them
      // into the system prompt.
      body: JSON.stringify({
        message: text,
        page_url: window.location.pathname + window.location.search,
        page_title: document.title || '',
        mode: (modeSelect ? modeSelect.value : 'general'),
      }),
    }).then(function(resp) {
      if (!resp.ok || !resp.body) throw new Error('stream HTTP ' + resp.status);
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function(chunk) {
          if (chunk.done) { turn.finish(assistantTextEl ? 'done' : 'error'); return; }
          buf += decoder.decode(chunk.value, {stream: true});
          var blocks = buf.split('\n\n');
          buf = blocks.pop();
          blocks.forEach(function(block) {
            var line = block.split('\n').filter(function(l) { return l.indexOf('data: ') === 0; })[0];
            if (!line) return;
            var raw = line.slice(6);
            try {
              var ev = JSON.parse(raw);
            } catch (_) { return; }
            turn.event(ev);
            if (ev.type === 'tool_call_finished') {
              // The dashboard.navigate tool returns {path, reason, kind:'navigate'}.
              // Surface that as a click-through chip so the merchant gets a
              // visible deep-link instead of a JSON-tool-result block they
              // have to copy-paste. Same-origin /dashboard/ only — the tool
              // enforces that server-side; we re-check here as defense.
              if (
                ev.name === 'dashboard.navigate'
                && !ev.error
                && ev.output && typeof ev.output === 'object'
                && typeof ev.output.path === 'string'
                && ev.output.path.indexOf('/dashboard/') === 0
              ) {
                var chip = document.createElement('a');
                chip.href = ev.output.path;
                chip.style.cssText = (
                  'display:inline-flex; align-items:center; gap:.4rem; margin:.4rem 0;'
                  + ' padding:.5rem .8rem; border-radius:999px;'
                  + ' background:var(--primary,#1a1a1a); color:var(--primary-fg,#fff);'
                  + ' font-size:.8rem; text-decoration:none; font-weight:500;'
                );
                chip.innerHTML = (
                  '<span>' + escapeHtml(ev.output.reason || 'Open in dashboard')
                  + '</span><span style="opacity:.7;">→</span>'
                );
                log.appendChild(chip); log.scrollTop = log.scrollHeight;
              }
            } else if (ev.type === 'assistant_text') {
              ensureAssistant();
              if (typer) typer.enqueue((ev.text || '') + '\n');
            } else if (ev.type === 'final') {
              turn.finish('done');
              ensureAssistant();
              if (ev.text && typer) typer.finalize(ev.text);
            } else if (ev.type === 'error') {
              turn.finish('error');
              ensureAssistant();
              if (typer) typer.finalize(ev.text || ev.error || '(error)');
              if (ev.error && ev.error !== ev.text) console.warn('[linda]', ev.error);
            }
          });
          return pump();
        });
      }
      return pump();
    }).catch(function() {
      turn.finish('error');
      pushLine('assistant', 'connection error');
    });
  });

  // Inline-affordance bridge: any "Ask Linda" button on a dashboard
  // page dispatches `morph:ask` with a prefill string. We open the panel,
  // pre-load history, and seed the input.
  window.addEventListener('morph:ask', function(e) {
    var prefill = (e.detail && e.detail.prefill) || '';
    panel.style.display = 'flex';
    loadHistory();
    var input = form.querySelector('input[name=message]');
    if (input) { input.value = prefill; input.focus(); }
  });
})();
</script>
